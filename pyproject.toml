[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sfsa"
version = "0.1.0"
description = "Smart facility fault and anomaly analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
models = ["xgboost>=2.1", "tensorflow>=2.18"]
quality = ["pytest>=8.0", "ruff>=0.8"]
all = ["xgboost>=2.1", "tensorflow>=2.18", "pytest>=8.0", "ruff>=0.8"]

[project.scripts]
sfsa = "sfsa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sfsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
